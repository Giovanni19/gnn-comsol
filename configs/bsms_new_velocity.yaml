name: bsms_predicted_velocity_test

seed: 68

dataset:
  path: C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_gnn_dataset.mat
  skip_initial: 1

split:
  mode: temporal
  train_fraction: 0.70
  val_fraction: 0.15
  gap: 1

training:
  num_epochs: 50
  batch_size: 8

networks:

  velocity:
    predicts: velocity
    features: time
    architecture: gcn

    num_neurons: 64
    num_layers: 3
    dropout: 0.0

    learning_rate: 1.0e-3
    weight_decay: 1.0e-5

  pressure:
    predicts: pressure
    features: time
    architecture: bsms

    use_predicted_velocity: true

    num_neurons: 64
    unet_depth: 5
    hidden_layers: 2

    learning_rate: 1.0e-3
    weight_decay: 1.0e-3

    num_layers: 1
    dropout: 0.0