name: reynolds

seed: 68

dataset:
  paths:
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_40R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_60R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_80R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_100R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_120R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_140R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_160R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_180R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_200R.mat
  skip_initial: 0

split:
  mode: simulation
  train_fraction: 0.80

training:
  num_epochs: 100
  batch_size: 2

networks:

  velocity:
    predicts: velocity
    predict_delta: true
    features: time
    architecture: gcn

    # Physics-informed terms, on the PREDICTED velocity: the continuity
    # residual div(u), and the momentum residual against the pressure
    # COMSOL computed. Both are reconstructed with WLSQ at the mesh
    # nodes and integrated over the cell-centered control volumes.
    # 0.0 trains on the data alone.
    #
    # They are physical quantities, so a useful weight depends on the
    # units of the simulation. Measure the residual of the COMSOL field
    # itself first - scripts/test_continuity_loss.py and
    # scripts/test_momentum_residual.py - because that is the floor a
    # prediction can be pushed down to.
    continuity_weight: 0.0
    momentum_weight: 0.0

    num_neurons: 64
    num_layers: 3
    dropout: 0.0

    learning_rate: 1.0e-3
    weight_decay: 1.0e-5

  pressure:
    predicts: pressure
    features: time
    predict_delta: true
    architecture: bsms

    num_neurons: 64
    unet_depth: 5
    hidden_layers: 2

    learning_rate: 1.0e-3
    weight_decay: 1.0e-3

    num_layers: 1
    dropout: 0.0

# Density and dynamic viscosity, in SI units. Only read when
# momentum_weight > 0, and only for the simulations whose .mat does not
# already carry them - first_database.m exports them when it can read
# spf.rho and spf.mu out of the COMSOL model.
#
# One pair for every simulation:
#
# fluid:
#   rho: 1.0
#   mu: 0.005
#
# or one pair per simulation id, which is what a Reynolds sweep that
# varies the viscosity needs:
#
# fluid:
#   0: {rho: 1.0, mu: 0.025}
#   1: {rho: 1.0, mu: 0.0167}