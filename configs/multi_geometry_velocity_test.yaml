name: multi_geometry_velocity_test

seed: 68

allow_partial_state: true

dataset:
  paths:
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_backstep_gnn_dataset.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_circular_cavity_gnn_dataset.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_elliptic_cavity_gnn_dataset.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_gnn_dataset.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_square_gnn_dataset.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_thin_gnn_dataset.mat
  skip_initial: 1

split:
  mode: simulation
  train_fraction: 0.70

training:
  num_epochs: 2
  batch_size: 8

networks:
  velocity:
    predicts: velocity
    features: time
    architecture: gcn
    num_neurons: 64
    num_layers: 3
    dropout: 0.0
    learning_rate: 1.0e-3
    weight_decay: 1.0e-5